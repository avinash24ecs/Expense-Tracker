<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">§</span>
    <h1>Ledger</h1>
  </div>
  <div class="month-control">
    <label for="month-select">Month</label>
    <input type="month" id="month-select">
  </div>
</header>

<main class="layout">

  <section class="panel panel-form">
    <h2>Add an expense</h2>
    <form id="expense-form">
      <div class="field">
        <label for="description">What was it for</label>
        <input type="text" id="description" placeholder="Groceries, train ticket, rent…" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" required>
        </div>
      </div>
      <div class="field">
        <label for="category">Category</label>
        <select id="category" required></select>
      </div>
      <button type="submit" class="btn-primary">Add expense</button>
      <p id="form-error" class="form-error" role="alert"></p>
    </form>

    <h2 class="budgets-heading">Monthly budgets</h2>
    <p class="hint">Set a limit per category. Leave at 0 for no limit.</p>
    <div id="budget-list" class="budget-list"></div>
  </section>

  <section class="panel panel-data">
    <div class="totals-row">
      <div class="total-card">
        <span class="total-label">Spent this month</span>
        <span class="total-value" id="total-spent">$0.00</span>
      </div>
      <div class="total-card">
        <span class="total-label">Entries</span>
        <span class="total-value" id="total-count">0</span>
      </div>
    </div>

    <div class="chart-wrap">
      <canvas id="category-chart" height="120"></canvas>
      <p id="chart-empty" class="hint chart-empty">No expenses yet this month — add one to see the breakdown.</p>
    </div>

    <div class="list-header">
      <h2>Expenses</h2>
      <select id="filter-category">
        <option value="All">All categories</option>
      </select>
    </div>

    <table class="expense-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th class="align-right">Amount</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="expense-rows"></tbody>
    </table>
    <p id="list-empty" class="hint list-empty">Nothing here yet.</p>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
